seed: 42
device: cuda:0
num_steps_per_env: 24
max_iterations: 5000
empirical_normalization: false
policy:
  class_name: DreamWaQPayloadActorCritic
  init_noise_std: 1.0
  noise_std_type: scalar
  actor_hidden_dims:
  - 512
  - 256
  - 128
  critic_hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  history_length: 5
  payload_history_length: 25
  payload_hidden_dims:
  - 64
  - 32
  payload_scale_kg: 8.0
  detach_payload: true
  use_payload_input: true
algorithm:
  class_name: DreamWaQPayloadPPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.01
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  symmetry_cfg: null
  rnd_cfg: null
  est_loss_coef: 0.1
  recon_loss_coef: 0.1
  kl_loss_coef: 0.0001
  est_target_start_idx: 0
  est_target_dim: 3
  payload_loss_coef: 0.1
clip_actions: null
save_interval: 100
experiment_name: PayloadEstimator
run_name: ''
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
log_root_path: logs/rsl_rl/payload_comparison
